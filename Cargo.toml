[package]
name = "gibson-ui"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
description = "A cinematic 3D file-system visualiser with a real terminal and file navigator"
license = "MIT"
repository = "https://github.com/Popidge/gibson-ui"
homepage = "https://github.com/Popidge/gibson-ui"
readme = "README.md"
publish = false

[features]
default = []
mixkit-audio = []

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.24", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
glam = { version = "0.30", features = ["bytemuck"] }
glyphon = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
inotify = "0.11"
kira = { version = "0.12", default-features = false, features = ["cpal", "ogg", "vorbis"] }
percent-encoding = "2.3"
portable-pty = "0.9"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vt100 = "0.16"
wgpu = "30"
winit = { version = "0.30", default-features = false, features = ["wayland", "rwh_06"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
